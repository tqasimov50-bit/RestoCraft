<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RestoCraft QR Menu</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#0f0f0f;
    color:#fff;
}

header{
    text-align:center;
    padding:35px 20px 25px;
    background:linear-gradient(180deg,#191919,#0f0f0f);
}

.logo{
    width:75px;
    height:75px;
    margin:auto;
    border-radius:50%;
    background:#ff7a00;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    font-weight:bold;
    color:#111;
}

.restaurant-name{
    font-size:30px;
    margin-top:15px;
    font-weight:bold;
}

.restaurant-name span{
    color:#ff7a00;
}

.subtitle{
    color:#999;
    margin-top:7px;
    font-size:14px;
}

.categories{
    position:sticky;
    top:0;
    z-index:10;
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:13px;
    background:rgba(15,15,15,.97);
    border-bottom:1px solid #292929;
}

.categories::-webkit-scrollbar{
    display:none;
}

.category{
    border:1px solid #333;
    background:#191919;
    color:#fff;
    padding:10px 17px;
    border-radius:25px;
    white-space:nowrap;
}

.category.active{
    background:#ff7a00;
    color:#111;
    border-color:#ff7a00;
}

.menu{
    max-width:700px;
    margin:auto;
    padding:10px 15px 30px;
}

.section{
    margin-top:25px;
}

.section-title{
    color:#ff7a00;
    font-size:23px;
    margin-bottom:13px;
}

.item{
    display:flex;
    align-items:center;
    gap:13px;
    background:#191919;
    border:1px solid #272727;
    border-radius:15px;
    padding:12px;
    margin-bottom:12px;
}

.food-image{
    width:85px;
    height:85px;
    border-radius:12px;
    object-fit:cover;
    background:#292929;
}

.info{
    flex:1;
}

.info h3{
    font-size:17px;
    margin-bottom:6px;
}

.info p{
    color:#999;
    font-size:13px;
    line-height:1.4;
}

.price{
    color:#ff7a00;
    font-size:17px;
    font-weight:bold;
    white-space:nowrap;
}

.contact{
    max-width:700px;
    margin:auto;
    padding:15px;
}

.contact-title{
    color:#ff7a00;
    text-align:center;
    margin-bottom:15px;
}

.contact-button{
    display:block;
    text-align:center;
    text-decoration:none;
    color:white;
    background:#1c1c1c;
    border:1px solid #333;
    padding:15px;
    border-radius:12px;
    margin-top:10px;
}

footer{
    text-align:center;
    padding:30px 15px;
    color:#666;
    font-size:12px;
}
</style>
</head>

<body>

<header>

<div class="logo">RC</div>

<div class="restaurant-name">
Resto<span>Craft</span>
</div>

<div class="subtitle">
Müasir QR Menyu
</div>

</header>


<div class="categories">

<button class="category active" onclick="filterMenu('all',this)">
Hamısı
</button>

<button
